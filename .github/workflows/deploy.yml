name: Deploy zu GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4


      - name: Statische Seite zusammenstellen (kein Build nötig)
        run: |
          mkdir _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' --exclude 'admin' --exclude 'tools' --exclude 'Admin-starten.bat' ./ _site/

      - name: Versionsnummer anhängen (damit Handys immer die neue Version laden)
        run: node tools/stamp.mjs _site "${{ github.sha }}"

      - name: Seite hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
